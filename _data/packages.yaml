- name: CUDA-Q
  domain: Quantum Computing Frameworks
  description: A unified platform for programming hybrid quantum-classical systems across QPUs, GPUs, and CPUs. Its repository includes the C++ and Python source code for the toolkit—featuring the nvq++ compiler, runtime, and integrated CPU/GPU backends for fast development and testing.
  pypi: cudaq
  github: NVIDIA/cuda-quantum
  organization: Nvidia
  dependency: "Dependency: optional (>5.0)"
  qutipRole: Bloch sphere visualization
  license: Apache 2.0
 
 
- name: Dynamiqs
  domain: Dynamics & Control
  description: It is a JAX-based Python library for GPU-accelerated and differentiable quantum simulations, offering solvers for the Schrödinger, Lindblad, and stochastic master equations.
  pypi: dynamiqs
  github: dynamiqs/dynamiqs
  organization:
  dependency: "Dependency: required (>=4.7)"
  qutipRole: Open-system Master Equations
  license: Apache 2.0


- name: Filter_functions
  domain: Characterization
  description: A Python package for calculating generalized filter functions for quantum control pulse sequences. It allows you to analyze how classical noise affects quantum gates, compute average gate infidelities and error transfer matrices, and optimize noise-resilient control pulses.
  pypi: filter_functions
  github: qutech/filter_functions
  organization: QuTech
  dependency: "Dependency: required (latest)"
  qutipRole: Uses Pauli spin operators and Qobj to model control and noise Hamiltonians; computes gate infidelities and plots Bloch trajectories.
  license: MIT License


- name: Pulser
  domain: Quantum Computing Frameworks
  description: An open-source Python library by Pasqal for designing and executing pulse-level, analog quantum experiments on neutral-atom devices. It allows users to define atomic registers and custom pulse sequences, and includes a QuTiP-powered emulator for simulating quantum dynamics before running on real hardware.
  pypi: pulser
  github: pasqal-io/Pulser
  organization: Pasqal
  dependency: "Dependency: optional (??)"
  qutipRole: Translating optical waveforms into time-dependent QobjEvo Hamiltonians; classical ODE evolution via mesolve.
  license: Apache 2.0


- name: pyEPR
  domain: Physical System Design
  description: A Python package for the automated design and quantization of superconducting quantum circuits and microwave devices. Using the Energy-Participation Ratio (EPR) method, it interfaces with electromagnetic field solvers to calculate circuit Hamiltonians, anharmonicities, and coupling strengths.
  pypi: pyEPR-quantum
  github: zlatko-minev/pyEPR
  organization:
  dependency: "Dependency: required (>=5.0.0)"
  qutipRole: Formulates multi-mode nonlinear Hamiltonians constructs Fock bases and extracts Kerr/dispersive shifts via numerical diagonalization.
  license: Apache 2.0


- name: QiliSDK
  domain: Quantum Computing Frameworks
  description: A modular Python framework by Qilimanjaro for developing analog, digital, and hybrid quantum programs. It streamlines workflow development and enables seamless integration across a variety of quantum computing platforms.
  pypi: qilisdk
  github: qilimanjaro-tech/qilisdk
  organization: Qilimanjaro Quantum Tech
  dependency: "Dependency: Optional backend (>=5.2.2 qip >= 0.4.0)"
  qutipRole: Provides backend execution provider for analog and digital-analog pulse schedules driven by QuTiP solver dynamics.
  license: Apache 2.0


- name: Qiskit
  domain: Quantum Computing Frameworks
  description: An open-source Python SDK for working with quantum computers at the level of circuits, operators, and primitives. It provides comprehensive tools for building, transpiling, optimizing, and executing quantum programs on simulators and real quantum hardware.
  pypi: qiskit
  github: Qiskit/qiskit
  organization: IBM
  dependency: "Dependency: required (a file)"
  qutipRole: Bloch sphere visualization and parallel map function
  license: Apache 2.0


- name: QuaCCAToo
  domain: Characterization
  description: QuaCCAToo (Quantum Color Centers Analysis Toolbox) is a Python library for simulating and analyzing the spin dynamics of quantum color centers (such as NV centers in diamond). It provides tools for modeling pulsed dynamics and open quantum systems for quantum sensing and technology applications.
  pypi: quaccatoo
  github: QISS-HZB/QuaCCAToo
  organization:
  dependency: "Dependency: required (>=5)"
  qutipRole: Spin Hamiltonian initialization multithreaded simulation of pulsed decoupling sequences via QuTiP parallel_map.
  license: GPL 3.0


- name: Scqubits
  domain: Physical System Design
  description: An open-source Python library for simulating and analyzing superconducting qubits. It provides tools to compute energy spectra, transition matrix elements, and coherence times for common qubit designs (such as transmon, fluxonium, and zero-pi) as well as composite Hilbert spaces.
  pypi: scqubits
  github: scqubits/scqubits
  organization:
  dependency: "Dependency: required (>=4.3)"
  qutipRole: Basis quantization composite Hilbert space generation and open-system Lindblad/Bloch-Redfield solvers.
  license: BSD 3-Clause


- name: SQcircuit
  domain: Physical System Design
  description: An open-source Python package for analyzing arbitrary superconducting quantum circuits. It automatically constructs circuit Hamiltonians in an optimal basis to compute energy spectra, eigenstates, and coherence properties from simple qubits to complex multi-mode circuits.
  pypi: SQcircuit
  github: stanfordLINQS/SQcircuit
  organization:
  dependency: "Dependency: required (>=5.0)"
  qutipRole: Circuit Quantization and Simulation
  license: BSD 3-Clause


- name: Spylind
  domain: Dynamics & Control
  description: A Python library for symbolically defining and efficiently solving ensembles of open quantum systems governed by the Lindblad master equation. It streamlines modeling by combining symbolic setup with fast numerical simulation.
  pypi: spylind
  github: morgatron/spylind
  organization:
  dependency: "Dependency: required (latest)"
  qutipRole: Converts symbolic master equations to numerical execution; wraps qutip.Qobj operators for Hamiltonian and Lindblad jump generators.
  license: MIT License