- name: cudaq
  pypi: cudaq
  github: NVIDIA/cuda-quantum
  organization: Nvidia
  status: "Dependency: optional (>5.0)"
  domain: Quantum Computing Frameworks
  qutipRole: Bloch sphere visualization
  description: Leverages QuTiP for robust Bloch sphere visualization of quantum states generated within the CUDA Quantum environment.
  license: Apache 2.0
 
 
- name: dynamiqs
  pypi: dynamiqs
  github: dynamiqs/dynamiqs
  organization: Alice & Bob
  status: "Dependency: required (>=4.7)"
  domain: Dynamics & Control
  qutipRole: Open-system Master Equations
  description: A high-performance quantum dynamics simulation library that heavily utilizes underlying quantum objects and solvers.
  license: Apache 2.0


- name: filter_functions
  pypi: filter_functions
  github: qutech/filter_functions
  organization: QuTech
  status: "Dependency: required (latest)"
  domain: Characterization
  qutipRole: Uses Pauli spin operators and Qobj to model control and noise Hamiltonians; computes gate infidelities and plots Bloch trajectories.
  description: Calculates generalized filter functions to characterize the sensitivity of quantum control operations to noise spectral densities. Interfaces with QuTiP to specify control/noise operators (sigmax sigmay sigmaz) and simulate Bloch sphere state trajectories.
  license: MIT License


- name: krotov
  pypi: krotov
  github: qucontrol/krotov
  organization:
  status: "Dependency: required (>=4.3 <5.0)"
  domain: Dynamics & Control
  qutipRole: Target/state algebraic definitions; forward-backward propagation using QuTiP differential equation solvers.
  description: Python implementation of Krotovs method for quantum optimal control with guaranteed monotonic convergence. Formulates drift control and jump operators as Qobj instances and relies on QuTiPs time-evolution integrators to compute coupled forward/backward state trajectories.
  license: BSD 3-Clause


- name: pulser
  pypi: pulser
  github: pasqal-io/Pulser
  organization: Pasqal
  status: "Dependency: optional (??)"
  domain: Quantum Computing Frameworks
  qutipRole: Translating optical waveforms into time-dependent QobjEvo Hamiltonians; classical ODE evolution via mesolve.
  description: Developed by Pasqal for pulse-level control of neutral-atom quantum processors. The pulser_simulation module transforms atom coordinates and laser drive pulses into time-dependent QobjEvo Hamiltonians and integrates Rydberg dynamics and decoherence with qutip.mesolve and qutip.sesolve.
  license: Apache 2.0


- name: pyEPR-quantum
  pypi: pyEPR-quantum
  github: zlatko-minev/pyEPR
  organization:
  status: "Dependency: required (>=5.0.0)"
  domain: Physical System Design
  qutipRole: Formulates multi-mode nonlinear Hamiltonians constructs Fock bases and extracts Kerr/dispersive shifts via numerical diagonalization.
  description: Interfaces with classical finite-element solvers (HFSS / PyAEDT) to automate the Energy Participation Ratio (EPR) quantization of distributed microwave circuits. Uses QuTiP Fock-space operators and numerical eigensolvers to calculate dressed frequencies transmon anharmonicities and cross-Kerr couplings.
  license: Apache 2.0


- name: qilisdk
  pypi: qilisdk
  github: qilimanjaro-tech/qilisdk
  organization: Qilimanjaro Quantum Tech
  status: "Dependency: Optional backend (>=5.2.2 qip >= 0.4.0)"
  domain: Quantum Computing Frameworks
  qutipRole: Provides backend execution provider for analog and digital-analog pulse schedules driven by QuTiP solver dynamics.
  description: Agnostic quantum software development kit for programming analog and digital-analog quantum hardware. Features a QuTiP backend provider (qilisdk[qutip]) that executes analog pulse schedules through QuTiP solvers to evaluate gate leakage open dynamics and cross-talk.
  license: Apache 2.0


- name: qiskit
  pypi: qiskit
  github: Qiskit/qiskit
  organization: IBM
  status: "Dependency: required (a file)"
  domain: Quantum Computing Frameworks
  qutipRole: Bloch sphere visualization and parallel map function
  description: Bloch sphere visualization and parallel map function. Utilizes QuTiP tools internally for robust state visualization and parallel processing workflows.
  license: Apache 2.0


- name: qsttoolkit
  pypi: qsttoolkit
  github: georgefitzgerald02/qsttoolkit
  organization:
  status: "Dependency: required (=5.1.1)"
  domain: Characterization
  qutipRole: High-dimensional synthetic quantum optical state synthesis (Qobj) Fock/coherent/cat/GKP bases and state fidelity calculation.
  description: Optical quantum state tomography package combining traditional Maximum Likelihood Estimation (MLE) and deep neural networks. Utilizes QuTiP as its generation engine for synthetic optical states (Fock coherent cat binomial GKP) and evaluates reconstruction accuracy via qutip.fidelity.
  license: MIT License


- name: quaccatoo
  pypi: quaccatoo
  github: QISS-HZB/QuaCCAToo
  organization:
  status: "Dependency: required (>=5)"
  domain: Characterization
  qutipRole: Spin Hamiltonian initialization multithreaded simulation of pulsed decoupling sequences via QuTiP parallel_map.
  description: Digital twin simulation toolbox for modeling nitrogen-vacancy (NV) centers in diamond and related solid-state color centers. Constructs multi-spin hyperfine and zero-field splitting Hamiltonians with QuTiP and executes large-scale ensemble simulations of dynamical decoupling sequences using qutip.parallel_map.
  license: GPL 3.0


- name: scqubits
  pypi: scqubits
  github: scqubits/scqubits
  organization:
  status: "Dependency: required (>=4.3)"
  domain: Physical System Design
  qutipRole: Basis quantization composite Hilbert space generation and open-system Lindblad/Bloch-Redfield solvers.
  description: Simulates superconducting artificial atoms (transmons fluxonium 0-π qubits) across charge flux and oscillator bases. Constructs composite multi-qubit and resonator spaces using QuTiP tensor products and evaluates coherence times via qutip.mesolve and qutip.brmesolve.
  license: BSD 3-Clause


- name: simuq
  pypi: simuq
  github: PicksPeng/SimuQ
  organization:
  status: "Dependency: optional (<5)"
  domain: Quantum Computing Frameworks
  qutipRole: Analog simulation provider (simuq[qutip]) executing user-specified analog Hamiltonian dynamics through qutip.mesolve.
  description: A domain-specific language for quantum Hamiltonian simulation with analog compilation. Compiles high-level Hamiltonian models into target pulse controls and includes a dedicated QuTiP provider that constructs time-dependent Hamiltonians and integrates time-evolution via qutip.mesolve.
  license: Apache 2.0


- name: SQcircuit
  pypi: SQcircuit
  github: stanfordLINQS/SQcircuit
  organization:
  status: "Dependency: required (>=5.0)"
  domain: Physical System Design
  qutipRole: Circuit Quantization and Simulation
  description: Provides framework for analysis and quantization of superconducting circuits. Depends on QuTiP for operators tensor spaces and overall quantum state definitions.
  license: BSD 3-Clause


- name: spylind
  pypi: spylind
  github: morgatron/spylind
  organization:
  status: "Dependency: required (latest)"
  domain: Dynamics & Control
  qutipRole: Converts symbolic master equations to numerical execution; wraps qutip.Qobj operators for Hamiltonian and Lindblad jump generators.
  description: Translates symbolic Lindblad master equations defined in SymPy into high-performance numerical code. Seamlessly accepts QuTiP Qobj instances for operators and collapses expressions into numerical callables compatible with QuTiP and hardware-accelerated backends.
  license: MIT License